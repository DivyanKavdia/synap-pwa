name: Align shell29 regression expectations

on:
  push:
    paths:
      - '.github/workflows/align-shell29-regressions.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align stale shell assertions
        shell: bash
        run: |
          grep -RIl "shell28-gemini-brain" tests --include='*.cjs' | while read -r file; do
            sed -i 's/shell28-gemini-brain/shell29-controls/g' "$file"
          done
          if git diff --quiet -- tests; then
            echo "No stale shell assertions remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Align remaining tests with controls shell"
          git push origin HEAD:main
