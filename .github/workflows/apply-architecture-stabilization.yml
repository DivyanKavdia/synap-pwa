name: Apply architecture stabilization
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-materialized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify architecture is already materialized
        run: |
          node tests/architecture-contract.cjs
          for test_file in tests/*.cjs; do node "$test_file"; done
