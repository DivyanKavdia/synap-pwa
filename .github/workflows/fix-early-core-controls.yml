name: Fix early core controls

on:
  push:
    paths:
      - '.github/workflows/fix-early-core-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep one early Connect and Settings binding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          connect='''    ui.connectButton.addEventListener("click", function () {\n      if (isGattConnected()) {\n        disconnectPendant();\n      } else {\n        connectPendant();\n      }\n    });\n\n'''
          bind_events=s.index('  function bindEvents() {')
          late=s.find(connect, bind_events)
          if late >= 0:
              s=s[:late]+s[late+len(connect):]
          if s.count('ui.connectButton.addEventListener("click"') != 1:
              raise SystemExit('expected exactly one Connect listener after cleanup')
          if s.count('ui.settingsButton.addEventListener("click", openSettings)') != 1:
              raise SystemExit('expected exactly one Settings listener in app.js')
          p.write_text(s)

          t=Path('tests/runtime-controls.cjs')
          q=t.read_text()
          marker="assert.match(core,/ui\\.settingsButton\\.addEventListener/,'Settings must be in the early core binder');"
          extra="\nassert.equal((app.match(/ui\\.connectButton\\.addEventListener/g)||[]).length,1,'Connect must be bound exactly once');\nassert.equal((app.match(/ui\\.settingsButton\\.addEventListener/g)||[]).length,1,'Settings must be bound exactly once in app.js');"
          if 'Connect must be bound exactly once' not in q:
              if marker not in q: raise SystemExit('runtime control test marker missing')
              q=q.replace(marker,marker+extra)
              t.write_text(q)
          PY
          git diff --check
          if git diff --quiet -- app.js tests/runtime-controls.cjs; then
            echo "Core controls are already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/runtime-controls.cjs
          git commit -m "Remove duplicate late Connect binding"
          git push origin HEAD:main
