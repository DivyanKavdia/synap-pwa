name: Android APK

# Builds the native shell in android/ on GitHub's runners, which ship the
# Android SDK. The APK is uploaded as a run artifact and also committed back
# to this branch, so it can be fetched either way.
on:
  push:
    branches: [android-shell]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Web Bluetooth shim contract
        working-directory: android
        run: node tools/shim-contract.cjs

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Stage the APK
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/synap-debug.apk
          ls -l android/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: synap-debug-apk
          path: android/dist/synap-debug.apk
          if-no-files-found: error

      - name: Commit the APK back to the branch
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android/dist/synap-debug.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
          else
            git commit -m 'Build Synap Android debug APK [skip ci]'
            git push origin HEAD:android-shell
          fi
