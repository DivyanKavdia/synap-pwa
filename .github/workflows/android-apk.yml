name: Android APK
on:
  push:
    branches: [android-shell]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the runner's preinstalled Android SDK
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses >/dev/null 2>&1 || true
          "$SDK" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Web Bluetooth shim contract
        working-directory: android
        run: node tools/shim-contract.cjs
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Stage the APK
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/synap-debug.apk
          ls -l android/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: synap-debug-apk
          path: android/dist/synap-debug.apk
          if-no-files-found: error
