name: Validate production PWA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-screenshots
          path: artifacts/workflows
          if-no-files-found: ignore

  webkit-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: node tools/wav-upload-smoke.cjs
        env:
          SYNAP_STORAGE_BROWSER: webkit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only. The envelope, memory validation and answer grounding
      # are pure functions; nothing here reaches GCP, Gemini or the network.
      - run: npm test

  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - run: npm ci
      - run: npm run build
      - name: Verify processing publication with disposable Firestore
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8085 --project=demo-synap-readiness --quiet > /tmp/synap-firestore.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" || true' EXIT
          node -e 'const net=require("node:net"); const deadline=Date.now()+60000; function probe(){const socket=net.connect(8085,"127.0.0.1");socket.on("connect",()=>{socket.destroy();process.exit(0)});socket.on("error",()=>{socket.destroy();if(Date.now()>deadline)process.exit(1);setTimeout(probe,500)})}probe()'
          node --require ./test/offline.cjs --env-file-if-exists=test/test.env --test dist/test/integration/*.test.js
      - name: Emulator log on failure
        if: failure()
        run: cat /tmp/synap-firestore.log
