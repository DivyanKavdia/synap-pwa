name: Validate production PWA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          for test_file in tests/*.cjs; do node "$test_file"; done

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/workflow-smoke.cjs
        env:
          SYNAP_WORKFLOW_OUTPUT: artifacts/workflows
      - run: node tools/transcript-smoke.cjs
        env:
          SYNAP_TRANSCRIPT_OUTPUT: artifacts/workflows/transcripts
      - run: node tools/controls-smoke.cjs
      - run: node tools/connection-smoke.cjs
      - run: node tools/connection-smoke.cjs
        env:
          SYNAP_RECOVERY_FIXTURE: "1"
      - run: node tools/meeting-features-smoke.cjs
      - run: node tools/firmware-progress-smoke.cjs
        env:
          SYNAP_FIRMWARE_OUTPUT: artifacts/workflows/firmware
      - run: node tools/audio-enhancement-smoke.cjs
      - run: node tools/settings-smoke.cjs
        env:
          SYNAP_SETTINGS_OUTPUT: artifacts/workflows/settings
      - run: node tools/library-selection-smoke.cjs
        env:
          SYNAP_LIBRARY_OUTPUT: artifacts/workflows/library
      - run: node tools/actions-smoke.cjs
        env:
          SYNAP_ACTIONS_OUTPUT: artifacts/workflows/actions
      - run: node tools/actions-functional-smoke.cjs
      - run: node tools/speaker-names-smoke.cjs
        env:
          SYNAP_SPEAKERS_OUTPUT: artifacts/workflows/speakers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-screenshots
          path: artifacts/workflows
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only. The envelope, memory validation and answer grounding
      # are pure functions; nothing here reaches GCP, Gemini or the network.
      - run: npm test
