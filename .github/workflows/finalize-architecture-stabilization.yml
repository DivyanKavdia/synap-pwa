name: Finalize architecture stabilization
on:
  push:
    branches: [audit/architecture-stabilization]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/architecture-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final consistency fixes
        run: node tools/finalize-architecture-stabilization.cjs
      - name: Validate and test
        run: |
          node --check enhancements.js
          node --check recording-bridge.js
          node --check capture-ui.js
          for test_file in tests/*.cjs; do node "$test_file"; done
      - name: Commit final consistency fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enhancements.js recording-bridge.js capture-ui.js tests/architecture-contract.cjs
          git commit -m "Finalize Synap architecture consistency"
          git push origin HEAD:audit/architecture-stabilization
