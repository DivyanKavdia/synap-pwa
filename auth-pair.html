<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>synap · Complete sign-in</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15171b;background:#f7f9fc;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#f7f9fc,#eef2f7)}
    main{width:min(100%,430px);background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:28px;padding:30px;box-shadow:0 18px 60px rgba(27,39,61,.12);text-align:center}
    .brand{font-size:32px;font-weight:750;letter-spacing:-1.2px;margin:0 0 8px}.eyebrow{margin:0 0 12px;font-size:12px;letter-spacing:.14em;font-weight:700;color:#657084}
    h1{font-size:25px;line-height:1.15;margin:0 0 12px;letter-spacing:-.5px}p{line-height:1.55;color:#596273;margin:0 0 22px}.gsi{display:flex;justify-content:center;min-height:44px}
    .status{margin-top:18px;font-size:14px;min-height:22px}.status[data-kind="ok"]{color:#167443}.status[data-kind="error"]{color:#a12929}
    .spinner{width:28px;height:28px;border:3px solid #dde3ea;border-top-color:#52606f;border-radius:50%;margin:16px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .privacy{font-size:12px;color:#7d8695;margin-top:24px}.hidden{display:none!important}
  </style>
</head>
<body>
<main>
  <p class="brand">synap</p>
  <p class="eyebrow">SECURE SIGN-IN</p>
  <h1>Complete Google sign-in in Safari</h1>
  <p id="copy">After you sign in, return to Bluefy. Synap will finish pairing automatically.</p>
  <div id="loading" class="spinner" aria-label="Loading Google Sign-In"></div>
  <div id="gsi" class="gsi"></div>
  <p id="status" class="status" role="status"></p>
  <p class="privacy">Your Google credential is sent only to the Synap backend for verification. It is never placed in the pairing URL.</p>
</main>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search);
  var pairId=String(params.get('pair_id')||'');
  var backend=String(params.get('backend')||'').replace(/\/+$/,'');
  var clientId=String(params.get('client_id')||'');
  var statusEl=document.getElementById('status');
  var loading=document.getElementById('loading');
  var host=document.getElementById('gsi');
  var copy=document.getElementById('copy');

  function status(message,kind){statusEl.textContent=message||'';statusEl.dataset.kind=kind||'';}
  function fail(message){loading.classList.add('hidden');host.classList.add('hidden');status(message,'error');}

  try{
    if(!/^[A-Za-z0-9_-]{16,128}$/.test(pairId))throw new Error('This Synap sign-in link is invalid.');
    var backendUrl=new URL(backend);
    if(backendUrl.protocol!=='https:')throw new Error('Synap backend must use HTTPS.');
    if(!clientId||clientId.length<20)throw new Error('Google Sign-In is not configured.');
  }catch(error){fail(error.message||'This Synap sign-in link is invalid.');return;}

  function approve(credential){
    loading.classList.remove('hidden');
    host.classList.add('hidden');
    status('Finishing sign-in…');
    fetch(backend+'/v1/auth/pair/approve',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Synap-Client':'pwa','X-Synap-Schema':'1'},
      body:JSON.stringify({pair_id:pairId,id_token:credential})
    }).then(function(response){
      return response.text().then(function(text){
        var data=null;try{data=text?JSON.parse(text):null;}catch(_error){}
        if(!response.ok){
          var message=data&&data.error&&data.error.message?data.error.message:'Sign-in could not be completed.';
          throw new Error(message);
        }
        return data;
      });
    }).then(function(){
      loading.classList.add('hidden');
      copy.textContent='Signed in successfully. Return to Bluefy and Synap will finish automatically.';
      status('✓ You can close this Safari tab.','ok');
    }).catch(function(error){
      loading.classList.add('hidden');
      host.classList.remove('hidden');
      status(error.message||'Sign-in failed.','error');
    });
  }

  var script=document.createElement('script');
  script.src='https://accounts.google.com/gsi/client';
  script.async=true;
  script.defer=true;
  script.onload=function(){
    loading.classList.add('hidden');
    if(!window.google||!google.accounts||!google.accounts.id){fail('Google Sign-In could not load.');return;}
    google.accounts.id.initialize({
      client_id:clientId,
      auto_select:false,
      callback:function(response){
        if(!response||!response.credential){status('Google Sign-In returned no credential.','error');return;}
        approve(response.credential);
      }
    });
    google.accounts.id.renderButton(host,{theme:'outline',size:'large',shape:'pill',text:'signin_with',width:280});
  };
  script.onerror=function(){fail('Google Sign-In could not be reached. Check your connection.');};
  document.head.appendChild(script);
})();
</script>
</body>
</html>
